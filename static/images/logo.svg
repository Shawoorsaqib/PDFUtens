<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Accent Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.6" />
    </linearGradient>

    <!-- Badge Red/Rose Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Logo Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#glossGrad)" />

  <!-- Main PDF Document Body -->
  <path d="M144 112 H296 L368 184 V400 C368 413.255 357.255 424 344 424 H144 C130.745 424 120 413.255 120 400 V136 C120 122.745 130.745 112 144 112 Z" fill="#FFFFFF" filter="url(#dropShadow)" />

  <!-- Folded Corner Sheet Top-Right -->
  <path d="M296 112 L368 184 H312 C303.163 184 296 176.837 296 168 V112 Z" fill="url(#foldGrad)" />

  <!-- Document Text Lines Mockup -->
  <rect x="160" y="220" width="136" height="18" rx="9" fill="#94A3B8" opacity="0.4" />
  <rect x="160" y="256" width="168" height="18" rx="9" fill="#94A3B8" opacity="0.4" />
  <rect x="160" y="292" width="104" height="18" rx="9" fill="#94A3B8" opacity="0.4" />

  <!-- PDF Utens Crimson Badge Pill -->
  <g filter="url(#badgeShadow)">
    <rect x="148" y="330" width="152" height="60" rx="18" fill="url(#badgeGrad)" />
    <text x="224" y="370" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PDF</text>
  </g>

  <!-- Utens Sparkle Overlay Symbol -->
  <path d="M380 96 L388 120 L412 128 L388 136 L380 160 L372 136 L348 128 L372 120 Z" fill="#F59E0B" />
</svg>
