<section class="upload-section" id="upload">
    <div class="container">
        <form class="upload-box" id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">

            <!-- Main Dropzone Prompt Content -->
            <div class="upload-content" id="uploadContent">
                <i class="bi bi-cloud-arrow-up upload-icon"></i>
                <h2>Drag & Drop your files</h2>
                <p>or click anywhere to browse from your device</p>
                <small>Supports PDF, DOCX, XLSX, PPTX, PNG, JPG, and WEBP</small>

                <input type="file" name="file" id="fileInput" accept=".pdf,.docx,.xlsx,.pptx,.png,.jpg,.jpeg,.webp"
                    multiple hidden>

                <div class="action-buttons">

                    <button type="button" class="btn btn-primary" id="chooseFileBtn">

                        <i class="bi bi-folder2-open"></i>
                        Choose File

                    </button>

                    <button type="button" class="btn btn-outline" id="addMoreBtn" style="display:none;">

                        <i class="bi bi-plus-circle-fill"></i>
                        Add More

                    </button>

                </div>
            </div>

            <!-- Selected Files Preview Container -->
            <div class="selected-files-container" id="selectedFilesContainer" style="display: none;"></div>

            <!-- Status Message -->
            <div id="uploadStatus" class="upload-status" style="display: none;"></div>

            <!-- Upload Action Button -->
            <div class="upload-actions" id="uploadActions" style="display: none;">
                <button type="submit" class="btn btn-success" id="uploadBtn">
                    <i class="bi bi-upload"></i> Upload & Convert
                </button>
            </div>

            <!-- Success Card -->
            <div id="successCard" class="success-card" style="display: none;">
                <div class="success-icon">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <h3>Conversion Complete!</h3>
                <p>Your PDF has been generated successfully.</p>

                <div class="success-actions">
                    <a id="downloadBtn" href="#" class="btn btn-primary" download>
                        <i class="bi bi-download"></i> Download PDF
                    </a>
                    <button id="convertAnotherBtn" type="button" class="btn btn-outline">
                        <i class="bi bi-arrow-counterclockwise"></i> Convert Another
                    </button>
                </div>
            </div>

        </form>
    </div>
</section>
