<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF Utens {% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>

<body>
    <header class="navbar">
        <div class="container">

            <nav>

                <!-- Logo -->
                <a href="/" class="logo">

                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="PDF Utens Logo">

                    <span>PDF Utens</span>

                </a>

                <!-- Desktop Navigation -->
                <ul class="nav-links">

                    <li><a href="/">Home</a></li>
                    <li><a href="{{ url_for('tools.tools_page') }}">Tools</a></li>
                    <li><a href="/#about">About</a></li>

                </ul>

                <!-- Desktop Actions -->
                <div class="nav-actions">

                    <!-- Theme Switcher Button -->
                    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
                        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                        <span class="theme-label" id="themeLabel">Dark</span>
                    </button>

                    <a href="https://github.com/Shawoorsaqib/PDFUtens" class="github-btn" target="_blank">

                        <i class="bi bi-github"></i>

                        GitHub

                    </a>

                </div>

                <!-- Mobile Menu Button -->
                <button class="menu-toggle" aria-label="Toggle Menu">

                    <i class="bi bi-list"></i>

                </button>

            </nav>

            <!-- Mobile Navigation -->

            <div class="mobile-menu">

                <a href="/">Home</a>

                <a href="{{ url_for('tools.tools_page') }}">Tools</a>

                <a href="/#about">About</a>

                <div class="mobile-theme-toggle" style="padding: 1rem 2rem; border-bottom: 1px solid var(--border);">
                    <button type="button" class="theme-toggle-btn mobile-theme-btn" id="mobileThemeToggleBtn" aria-label="Toggle Mobile Theme">
                        <i class="bi bi-moon-stars-fill" id="mobileThemeIcon"></i>
                        <span id="mobileThemeLabel">Dark Mode</span>
                    </button>
                </div>

                <a href="https://github.com/Shawoorsaqib/PDFUtens" target="_blank">

                    <i class="bi bi-github"></i>

                    GitHub

                </a>

            </div>

        </div>

    </header>

    {% block content %}

    {% endblock %}


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="{{ url_for('static', filename='js/preview.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tool_uploader.js') }}"></script>
    <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>

</html>
